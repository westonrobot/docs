# Declared tag vocabulary for the Guides section.
#
# onInlineTags: 'throw' is set on this plugin instance in docusaurus.config.ts,
# so a tag that is not declared here fails the build rather than quietly
# creating a near-duplicate tag page. Add new tags here first.
#
# Four facets: model, vendor, solution, topic. Keep them flat — Docusaurus tags
# have no hierarchy — and prefer adding to an existing facet over inventing one.

# --- model -------------------------------------------------------------------
g1:
  label: G1
  permalink: /g1
  description: Guides that apply to the Unitree G1 humanoid.
