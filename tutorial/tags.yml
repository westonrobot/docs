  label: Scout Mini
  permalink: /scout-mini
  description: Guides that apply to the AgileX Scout Mini.
ranger-mini:
  label: Ranger Mini
  permalink: /ranger-mini
  description: Guides that apply to the AgileX Ranger Mini 2.0 and 3.0.
ugv-devkit:
  label: UGV Development Kit
  permalink: /ugv-devkit
  description: Guides that apply to the UGV Development Kit.
pocket2:
  label: Pocket2
  permalink: /pocket2
  description: Guides that apply to the Manifold Pocket2 Scanner.

