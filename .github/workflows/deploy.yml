name: Deploy Docusaurus site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # showLastUpdateTime reads each page's last commit date, so the
          # default shallow clone would leave every timestamp wrong or absent.
          fetch-depth: 0

      # ADR 0001 D8. Runs before the Node setup because it needs only git, so a
      # video that breaches the budget fails in seconds rather than after a full
      # install and build.
      - name: Check in-repo video budget
        run: bash scripts/check-video-budget.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `docusaurus build` does not typecheck, so TS errors in the config,
      # the sidebars or src/ would otherwise ship unnoticed.
      - name: Typecheck
        run: npm run typecheck

      - name: Build website
        run: npm run build

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-build
          path: ./build
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docusaurus-build
          path: ./build
          
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 