name: Deploy Docusaurus site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # showLastUpdateTime reads each page's last commit date, so the
          # default shallow clone would leave every timestamp wrong or absent.
          fetch-depth: 0

      # ADR 0001 D8. Runs before the Node setup because it needs only git, so a
      # video that breaches the budget fails in seconds rather than after a full
      # install and build.
      - name: Check in-repo video budget
        run: bash scripts/check-video-budget.sh

      # Both use the runner's python3 rather than `npm run`, so they execute
      # before the Node setup and a naming or publishing mistake fails in
      # seconds instead of after an install and a build.
      - name: Test file-store key derivation
        run: python3 -m unittest discover -s scripts -t scripts

      # The gate behind local-first authoring: static/_upload/ is gitignored,
      # so a page committed before its document was uploaded resolves here
      # against nothing. See docs/design/file-hosting.md §3.
      - name: Check download references
        run: python3 scripts/check-downloads.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `docusaurus build` does not typecheck, so TS errors in the config,
      # the sidebars or src/ would otherwise ship unnoticed.
      - name: Typecheck
        run: npm run typecheck

      - name: Build website
        run: npm run build

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docusaurus-build
          path: ./build
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: docusaurus-build
          path: ./build
          
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # include-hidden-files restores pre-v4 behaviour: from v4 this action
      # drops dotfiles, and the Docusaurus build emits `build/.nojekyll`.
      # Nothing in the output is underscore-prefixed today, so losing it would
      # not break the current site — but the deployed artifact should not
      # quietly change contents as a side effect of a runtime bump.
      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 